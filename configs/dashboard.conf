--[[
    conky-dashboard -- window setup only.

    conky.text is deliberately empty: every pixel is drawn from lua/dashboard.lua
    via the draw hook.  This file's job is to create a transparent, full-height
    window on the right edge and point conky at that script.
]]

-- The desktop's usable area, excluding space reserved by panels and docks.
-- This is what keeps the dashboard off a Plasma panel: ask for exactly this
-- and the window manager never has to shrink the window afterwards.
--
-- That shrinking is the trap.  conky decides its layout from the size it
-- *asked* for, not the size it was given, so a window clamped from 1440 to
-- 1395 still draws a 1440-tall panel and the bottom 45px -- the button labels
-- -- fall outside the window and are clipped.
local function workarea()
    local pipe = io.popen("xprop -root _NET_WORKAREA 2>/dev/null")
    if not pipe then return nil end
    local text = pipe:read("a") or ""
    pipe:close()
    -- _NET_WORKAREA(CARDINAL) = x, y, width, height   (repeated per desktop)
    local _, y, _, h = text:match("=%s*(%d+),%s*(%d+),%s*(%d+),%s*(%d+)")
    return tonumber(h), tonumber(y)
end

-- Fallback when xprop is not installed: the kernel publishes each connector's
-- mode list, and the first line of a connected one is its active mode.  This
-- ignores panels, so pair it with `bottom_gap` in lua/dashboard.lua.
local function display_height()
    local tallest = nil
    local pipe = io.popen("cat /sys/class/drm/*/modes 2>/dev/null")
    if pipe then
        for line in pipe:lines() do
            local h = tonumber(line:match("^%d+x(%d+)"))
            if h and (not tallest or h > tallest) then tallest = h end
        end
        pipe:close()
    end
    return tallest
end

local work_h, work_y = workarea()
local panel_height = tonumber(os.getenv("CONKY_DASHBOARD_HEIGHT"))
                     or work_h or display_height() or 1048
local panel_width  = tonumber(os.getenv("CONKY_DASHBOARD_WIDTH")) or 400
-- Start below a top panel, if there is one.
local panel_top    = tonumber(os.getenv("CONKY_DASHBOARD_TOP")) or work_y or 0

conky.config = {
    -- Drives both the hover fade and the CPU/network sampling rate.  Cheap
    -- now that a frame spawns no processes; while the panel is hidden the
    -- draw hook returns immediately and only the /proc reads happen.
    update_interval = 0.2,

    override_utf8_locale = true,
    double_buffer = true,
    no_buffers = true,
    imlib_cache_size = 0,

    own_window = true,
    own_window_title = 'conky-dashboard',
    own_window_class = 'conky-dashboard',
    own_window_type = 'normal',
    -- own_window_transparent and own_window_argb_visual are gone in conky 1.24:
    -- ARGB is always on when a compositor is available and opacity now comes
    -- from the window colour's alpha channel (#AARRGGBB).
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- A non-zero border makes the window two pixels taller than requested,
    -- which is enough to push it back over the work area and get it clamped.
    border_width = 0,
    border_inner_margin = 0,
    border_outer_margin = 0,

    minimum_width  = panel_width,
    maximum_width  = panel_width,
    minimum_height = panel_height,

    alignment = 'top_right',
    gap_x = 0,
    gap_y = panel_top,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Resolved against *this file's* directory, so the repository runs in
    -- place and nothing has to be copied to a fixed path first.
    lua_load = '../lua/dashboard.lua',
    lua_draw_hook_pre = 'start_widgets',
    -- Native pointer events; conky prefixes the name with 'conky_'.
    lua_mouse_hook = 'mouse_event',
};

conky.text = [[]];
